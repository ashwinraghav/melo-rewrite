[project]
name = "mello-api"
version = "0.0.1"
description = "Mello REST API — FastAPI on Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "firebase-admin>=6.6",
    "google-cloud-storage>=2.18",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "httpx>=0.27",
    "google-genai>=1.0",
    "Pillow>=10.0",
    "elevenlabs>=2.0",
    "cohere>=5.0",
    "google-cloud-tasks>=2.16",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.0",
    "gcloud-aio-storage>=9.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-grpc>=0.41b0",
    "opentelemetry-instrumentation-logging>=0.41b0",
    "opentelemetry-exporter-gcp-trace>=1.6",
    "opentelemetry-exporter-gcp-monitoring>=1.6.0a0",
    "opentelemetry-resourcedetector-gcp>=1.6.0a0",
    "opentelemetry-propagator-gcp>=1.6",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-anyio>=0.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "ASYNC"]
